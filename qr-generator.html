<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luxury QR Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- QR Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: 'Poppins', sans-serif;
}

.qr-card {
    width: 100%;
    max-width: 400px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    color: #fff;
    animation: fadeIn 1s ease;
}

.btn-gold {
    background: linear-gradient(45deg, #d4af37, #f9d423);
    border: none;
    color: #000;
    font-weight: bold;
}

.btn-gold:hover {
    transform: scale(1.03);
}

#qrBox img {
    margin-top: 15px;
    animation: pop 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pop {
    from { transform: scale(0.5); }
    to { transform: scale(1); }
}

    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card qr-card p-4">
        <h2 class="text-center mb-4">✨ QR Code Generator</h2>

        <input type="text" id="qrText" class="form-control mb-3" placeholder="Enter text or URL">

        <button class="btn btn-gold w-100 mb-3" onclick="generateQR()">Generate QR</button>

        <div id="qrBox" class="text-center mb-3"></div>

        <button class="btn btn-outline-light w-100" onclick="downloadQR()">Download QR</button>
    </div>
</div>

<script>
    let qr;

function generateQR() {
    const qrBox = document.getElementById("qrBox");
    const text = document.getElementById("qrText").value;

    qrBox.innerHTML = "";

    if (text.trim() === "") {
        alert("Please enter text or URL");
        return;
    }

    qr = new QRCode(qrBox, {
        text: text,
        width: 200,
        height: 200,
        colorDark: "#ffffff",
        colorLight: "transparent",
        correctLevel: QRCode.CorrectLevel.H
    });
}

function downloadQR() {
    const img = document.querySelector("#qrBox img");
    if (!img) {
        alert("Generate QR first");
        return;
    }

    const link = document.createElement("a");
    link.href = img.src;
    link.download = "qr-code.png";
    link.click();
}

</script>
</body>
</html>
